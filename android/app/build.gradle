plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def dotenvProperties = new Properties()
def dotenvFile = rootProject.file('../.env')
if (dotenvFile.exists()) {
    dotenvFile.withInputStream { dotenvProperties.load(it) }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def pubspecFile = rootProject.file('../pubspec.yaml')
def parsedVersionCode = flutter.versionCode
def parsedVersionName = flutter.versionName

if (pubspecFile.exists()) {
    def pubspecContent = pubspecFile.text
    def versionMatch = (pubspecContent =~ /version:\s*([^\s+]+)\+?(\d+)?/)
    if (versionMatch.find()) {
        parsedVersionName = versionMatch.group(1)
        if (versionMatch.group(2)) {
            parsedVersionCode = Integer.parseInt(versionMatch.group(2))
        }
    }
}

android {
    namespace = "com.ideal.uz"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ideal.uz"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = parsedVersionCode
        versionName = parsedVersionName
        testInstrumentationRunner = "pl.leancode.patrol.PatrolJUnitRunner"
        testInstrumentationRunnerArguments["clearPackageData"] = "true"
        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] =
            dotenvProperties.getProperty("GOOGLE_MAPS_API_KEY", "")
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = (keystorePropertiesFile.exists() && keystoreProperties['storeFile'] != null)
                ? signingConfigs.release
                : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    flavorDimensions "app"
    productFlavors {
        dev {
            dimension "app"
            resValue "string", "app_name", "iDeal Mobile Dev"
            versionNameSuffix "-dev"
            applicationId "com.ideal.uz.dev"
        }
        prod {
            dimension "app"
            resValue "string", "app_name", "iDeal Mobile"
            applicationId "com.ideal.uz"
        }
    }

    testOptions {
        execution = "ANDROIDX_TEST_ORCHESTRATOR"
    }
}

flutter {
    source = "../.."
}

dependencies {
    androidTestUtil "androidx.test:orchestrator:1.5.1"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
    implementation 'com.google.j2objc:j2objc-annotations:3.0.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
}
