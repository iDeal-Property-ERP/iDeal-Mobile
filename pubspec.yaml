name: ideal_mobile
description: >
  iDeal Mobile marketplace application.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^10.3.0
  bloc: ^9.1.0
  flutter_bloc: ^9.1.1
  firebase_core: ^4.0.0
  firebase_crashlytics: ^5.0.0
  firebase_messaging: ^16.0.3
  awesome_notifications: ^0.10.1
  intl_phone_number_input: ^0.7.4
  phone_numbers_parser: ^9.0.3
  pinput: ^6.0.1
  sms_autofill: ^2.4.0
  equatable: ^2.0.5
  flutter_tabler_icons: ^1.43.0
  flutter_localization: ^0.3.2
  flutter_svg: ^2.1.0
  path_provider: ^2.1.5
  font_awesome_flutter: ^10.8.0
  debounce_throttle: ^2.0.0
  flutter_fgbg: ^0.7.1
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  image: ^4.3.0
  country_picker: ^2.0.27
  shared_preferences: ^2.5.4
  sizer: ^3.0.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  file: ^7.0.1
  timeago: ^3.7.1
  mobkit_dashed_border: ^0.0.8
  shimmer: ^3.0.0
  image_viewer_pro: ^1.0.0
  connectivity_plus: 7.0.0
  flutter_native_splash: ^2.4.6
  permission_handler: 12.0.0+1
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  dartz: ^0.10.0
  get_it: ^9.2.0
  dio: ^5.8.0+1
  flutter_dotenv: ^6.0.0
  lottie: ^3.3.1
  http_certificate_pinning: ^3.0.1
  flutter_secure_storage: ^9.2.4
  dio_cache_interceptor: ^4.0.3
  http_cache_file_store: ^2.0.1
  google_nav_bar: ^5.0.7
  clarity_flutter: ^1.4.0
  mime: ^2.0.0
  uuid: ^4.5.1
  device_info_plus: 12.3.0
  vibration: ^3.1.4
  open_settings_plus: ^0.4.0
  timezone: ^0.10.1
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  yandex_maps_mapkit: ^4.42.0
  photo_view: ^0.15.0
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  flutter_gen_runner: ^5.8.0
  auto_route_generator: ^10.2.6
  mocktail: ^1.0.4
  shared_preferences_platform_interface: ^2.4.2
  bloc_test: ^10.0.0
  alchemist: ^0.13.0
  mocktail_image_network: ^1.2.0
  patrol: ^3.19.0

flutter_native_splash:
  color: "#000000"

flutter:
  uses-material-design: true
  # TODO: https://docs.flutter.dev/release/breaking-changes/flutter-generate-i10n-source
  generate: true
  config:
    enable-swift-package-manager: false

  assets:
    - assets/icons/
    - assets/images/
    - assets/test/images/
    - assets/test/files/
    - .env
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        # 200 ExtraLight
        - asset: assets/fonts/Inter/Inter-Black.ttf
          weight: 200

        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 200

        #300 Light
        - asset: assets/fonts/Inter/Inter-ExtraBold.ttf
          weight: 300
        - asset: assets/fonts/Inter/Inter-ExtraLight.ttf
          weight: 300

        #400 Normal
        - asset: assets/fonts/Inter/Inter-Light.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 400

        #500 Medium
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 500
          style: italic

        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 500

        #600 Semi-bold
        - asset: assets/fonts/Inter/Inter-Thin.ttf
          weight: 600

patrol:
  app_name: iDeal Mobile
  flavors: dev
  android:
    package_name: com.ideal.mobile.dev
  ios:
    bundle_id: com.ideal.mobile.dev
